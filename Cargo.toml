[workspace]
resolver = "2"
members = [
    "crates/vaultx-cli",
    "crates/vaultx-tui",
    "crates/vaultx-core",
    "crates/vaultx-types",
    "crates/vaultx-repository",
    "crates/vaultx-crypto",
    "crates/vaultx-keyring",
    "crates/vaultx-policy",
    "crates/vaultx-broker",
    "crates/vaultx-broker-client",
    "crates/vaultx-http",
    "crates/vaultx-policy-packs",
    "crates/vaultx-audit",
    "crates/vaultx-sync-client",
    "crates/vaultx-control-plane",
    "crates/vaultx-mcp",
    "crates/vaultx-testkit",
]
# The fuzz package links libfuzzer-sys and needs nightly-only link flags,
# so it must never be built by stable workspace commands (plan §43).
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Shared dependency versions are declared here; member crates reference
# them with `{ workspace = true }`. Dependencies are added per crate in
# later tasks.
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
hex = "0.4"
url = "2"

# Test-only utilities shared across member crates.
tempfile = "3"
# Property-based testing (plan §43 properties); fuzz targets are separate.
proptest = "1"

# Crypto primitives used by `vaultx-crypto`. RNG strategy is pinned to
# `rand_core` 0.6 + `getrandom` (the version expected by aes-gcm 0.10 and
# ed25519-dalek 2); the top-level `rand` crate is intentionally not used.
aes-gcm = { version = "0.10", features = ["std", "zeroize"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hmac = "0.12"
# Note: sha2 0.10 publishes no `zeroize` feature (features: asm, compress,
# force-soft*, oid, std), so its internal block buffers cannot be scrubbed;
# fingerprint inputs must therefore be treated as secret-safe types upstream.
rand_core = { version = "0.6", features = ["getrandom"] }
# Used directly by `vaultx-audit` for audit event id / correlation id
# generation; same 0.2 line already pulled transitively by rand_core 0.6.
getrandom = "0.2"
sha2 = "0.10"
subtle = "2"
zeroize = "1"
# Used by `vaultx-broker` for HTTP Basic credential injection.
base64 = "0.22"
# Used by `vaultx-cli` only for no-echo secret-value prompts.
rpassword = "7"
# Async runtime for the broker IPC server, client, and real transport.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
# Terminal UI (plan §15): ratatui renders; crossterm drives input and
# the terminal backend. Versions are kept in lockstep with the
# ratatui-crossterm backend crate.
ratatui = { version = "0.30" }
crossterm = "0.29"
# Hardened outbound HTTP client for the broker transport (rustls only;
# default features pull the native-tls stack and are deliberately off).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# TLS stack shared with reqwest (plan §30 remote broker gateway): the
# server/client configs below pin the `ring` provider explicitly.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
# Cedar authorization engine backing the `cedar` policy-engine mode
# (`VAULTX_POLICY_ENGINE=cedar`); pinned to the 4.x line.
cedar-policy = "4"
# Unix-only: flock-based session-store coherence and uid-scoped endpoints.
libc = "0.2"
# Control-plane REST surface (plan §39). Default features are trimmed to
# what the milestone actually uses; routing params use the 0.8 `{param}`
# syntax.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# Test-only HTTP plumbing driving the axum router in-process (oneshot).
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
