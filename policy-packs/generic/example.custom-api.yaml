# Generic example: invoking a custom internal-style API through the
# broker. Hosts must still be public registrable names, so this uses a
# placeholder corporate domain.
#
# Demonstrates multiple methods, wildcard tails, a query allowlist, and
# response field redaction (exact JSON object keys only).
format: 1
name: generic.example-api.invoke
provider: generic
request:
  hosts: [api.example-corp.dev]
  methods: [GET, POST]
  paths:
    - "/api/{tenant}/widgets"
    - "/api/{tenant}/widgets/**"
  query_allowlist: [page, limit]
  variables:
    tenant: string
credential:
  credential_ref: example-api-token
  injection: api-key-header
constraints:
  max_body_bytes: 16384
  content_types: [application/json]
response:
  max_body_bytes: 131072
  redact_headers: [set-cookie, x-request-id]
  # Bare object keys only: the sanitizer matches exact keys.
  redact_fields: [secret_note]
