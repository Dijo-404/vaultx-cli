[package]
name = "vaultx-broker"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
vaultx-audit = { path = "../vaultx-audit" }
vaultx-crypto = { path = "../vaultx-crypto" }
vaultx-http = { path = "../vaultx-http" }
vaultx-policy = { path = "../vaultx-policy" }
vaultx-types = { path = "../vaultx-types" }

[dev-dependencies]
# Self-signed certificates let transport tests exercise the real rustls
# handshake against a loopback TLS stub without touching the network.
rcgen = "0.13"
tokio-rustls = "0.26"
tempfile = { workspace = true }
