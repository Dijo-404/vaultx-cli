[package]
name = "vaultx-sync-client"
version.workspace = true
edition.workspace = true

license.workspace = true
publish.workspace = true
[features]
default = []
# Opt-in hardened reqwest transport plus the session/remote plumbing that
# builds a ready-to-use sync client (shared by the CLI and the TUI so both
# surfaces keep ONE implementation of timeouts, redirects-off, and body
# caps).
reqwest = ["dep:reqwest"]

[dependencies]
getrandom = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
vaultx-control-plane = { path = "../vaultx-control-plane" }
vaultx-crypto = { path = "../vaultx-crypto" }
vaultx-keyring = { path = "../vaultx-keyring" }
vaultx-repository = { path = "../vaultx-repository" }
vaultx-types = { path = "../vaultx-types" }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
